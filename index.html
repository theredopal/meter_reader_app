<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6f8">
  <title>Meter Reader Tools</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #1c2733;
      --muted: #5b6b7b;
      --accent: #0b6bcb;
      --line: #dde4ea;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    main {
      width: min(100%, 760px);
      padding: clamp(24px, 5vw, 48px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 36px rgb(28 39 51 / 8%);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 40px);
      letter-spacing: -0.03em;
    }

    .intro {
      margin: 10px 0 28px;
      color: var(--muted);
      line-height: 1.6;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }

    .choice {
      display: flex;
      min-height: 180px;
      flex-direction: column;
      align-items: flex-start;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
    }

    .choice:hover, .choice:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 8px 20px rgb(11 107 203 / 12%);
      transform: translateY(-2px);
    }

    .choice:focus-visible {
      outline: 3px solid rgb(11 107 203 / 28%);
      outline-offset: 3px;
    }

    .choice h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .choice p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.5;
    }

    .action {
      margin-top: auto;
      color: var(--accent);
      font-weight: 700;
    }

    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Meter Reader Tools</h1>
    <p class="intro">Choose which meter-reading tool you want to use.</p>

    <nav class="choices" aria-label="Choose a meter reader">
      <a class="choice" href="./meter_reader.html">
        <h2>Meter Route Planner</h2>
        <p>Open the existing Google Maps route planner.</p>
        <span class="action">Open classic planner →</span>
      </a>

      <a class="choice" href="./special_reader.html">
        <h2>Special Reader</h2>
        <p>Open the new special-purpose meter reader.</p>
        <span class="action">Open special reader →</span>
      </a>
    </nav>

    <footer>Both tools are available from this page.</footer>
  </main>
</body>
</html>
